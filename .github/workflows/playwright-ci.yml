name: Playwright CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      ECOMMERCE_TEST_ENV: qa
      ECOMMERCE_QA_BASE_URL: ${{ secrets.ECOMMERCE_QA_BASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check QA URL configuration
        run: |
          if [ -z "$ECOMMERCE_QA_BASE_URL" ]; then
            echo "Configure the ECOMMERCE_QA_BASE_URL repository secret with the approved QA base URL."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore